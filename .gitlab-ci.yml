# =============================================================================
# GitLab CI — Discover-Slovenia-AI (rekonstrukcija 2.x)
#
# Naslednik GitHub Actions ci.yml izvirnika (626 commitov, izgubljen ob
# varnostnem incidentu 2026-10-06 — račun markec12345678 je mrtev).
# Izvirnik je na vsak push poganjal: lint → test → typecheck → build.
#
# P0-J VRATA (issue #1 §24 + sprejemni kriterij „CI has lint + typecheck +
# test + build + smoke"; prva 5 vrat izvedena 2026-10-07, smoke + artefakti
# + migration safety dodani 2026-10-08):
#   1. lint        — eslint . (0 napak je pogoj za zlivo)
#   2. typecheck   — tsc --noEmit (bun-types vključen v tsconfig "types";
#                    vrata so ČISTA — 0 napak, tudi testi tipizirani)
#   3. test        — bun test + JUNIT poročilo (vidno v zavihku Testi;
#                    artefakt reports/junit.xml se naloži OB VSAKEM izidu)
#   4. prisma      — prisma validate (shema veljavna brez žive baze)
#   5. build       — next build (standalone izhod; strani so statika iz
#                    lastnih registrov — brez DB dostopa ob buildu)
#   6. smoke       — MIGRATION SAFETY: bun run db:materialize (= prisma
#                    db push --skip-generate) materializira SVEŽO SQLite
#                    iz praznega stanja BREZ --accept-data-loss — kar bi
#                    zahtevalo destruktivno spremembo, pošteno pade;
#                    nato zagon produkcijskega standalone strežnika
#                    (PORT 3100) + samo-bralni dim 19 preverb (9 strani,
#                    health status/verzija/preverbe, register destinacij,
#                    /go preusmeritve, VARNOSTNI negativni dim: 4 cron
#                    poti 401 brez žetona).
#   7. e2e         — Playwright zlata pot + mobilni projekt (2.51.0,
#                    pariteta s GitHub ci.yml iz 2.47.0): sveža SQLite,
#                    chromium s sistemskimi odvisnostmi, webServer požene
#                    `next dev` na 3100; artefakti (poročilo + sledi) se
#                    naložijo tudi ob padcu.
#   8. pg-live     — POSTGRESQL LIVE VRATA (2.66.0, issue #2 §2/§3): živ PG 17
#                    v uporabniškem prostoru (npm binarke @embedded-postgres —
#                    brez Docker services in root-a); shadow replay (migracije ≡
#                    shema → prazna difa) → migrate deploy 0_init → idempotenca
#                    → integrity (tabele ≡ modeli) → seed data plane. Lekcija 9
#                    (lokalna CI-paritetna verifikacija 15. 10.) na podatkovno
#                    plast: prvi cutover NE SME biti prvi zagon db:pg:deploy.
#
# ARTEFAKTI/REPORTI (§24): junit.xml + smoke-report.json + smoke.txt +
# server.log se naložijo z when: always — tudi padec je dokaz, ne smeti.
#
# SQLite opomba (iskrena): repozitorij namerno uporablja SQLite + db push
# (brez map migracij); produkcijska prevezava na Postgres/Neon plast je
# ločeno lastnikovo dejanje — issue #2 (PRODUCTION CUTOVER + POSTGRES).
#
# build/deploy v PRODUKCIJO sta NAMENOMA ločena: produkciji (Render/Vercel)
# še vedno služita izvirniku 1.190.0 — prevezava na novi repozitorij je
# lastnikovo zunanje dejanje (glej docs/recovery/RECOVERY-REPORT.md §8).
# =============================================================================

image: oven/bun:1

stages:
  - lint
  - typecheck
  - test
  - prisma
  - pg-live
  - build
  - smoke
  - e2e

variables:
  DATABASE_URL: "file:/tmp/ci-skip.db"

lint:
  stage: lint
  script:
    - bun install --frozen-lockfile
    - bunx prisma generate
    - bun run lint

typecheck:
  stage: typecheck
  script:
    - bun install --frozen-lockfile
    - bunx prisma generate
    - bun run typecheck

test:
  stage: test
  script:
    - bun install --frozen-lockfile
    - bunx prisma generate
    - mkdir -p reports
    - bun test --reporter=junit --reporter-outfile=reports/junit.xml
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 1 week

prisma-validate:
  stage: prisma
  script:
    - bun install --frozen-lockfile
    - bunx prisma validate
    # ISSUE #2 §1 — POSTGRES DATA PLANE (CI vrata brez baze):
    # db:pg:check = (a) prisma/postgres/schema.prisma IDENTIČNA glavni shemi
    # (edina razlika provider sqlite→postgresql), (b) baseline 0_init
    # IDENTIČEN svežemu `prisma migrate diff --from-empty` (migracije ≡
    # shema — dokazljivo na vsak push, brez žive baze); db:pg:validate =
    # produkcjska (postgresql) shema veljavna.
    - bun run db:pg:check
    # db:pg:validate (postgresql provider) preverja OBLIKO env URL proti
    # protokolu — CI-only dummy vrednost (brez povezave; globalni DATABASE_URL
    # je file: za ostale stopnje). db:pg:check je protokol-neodvisen.
    - DATABASE_URL="postgres://ci-skip:ci-skip@localhost:5432/ci_skip" bun run db:pg:validate

pg-live:
  stage: pg-live
  script:
    - bun install --frozen-lockfile
    # 8. VRATA (2.66.0): živ PostgreSQL 17 v uporabniškem prostoru — skripta
    # sama hidrira binarne knjižnice (kopije namesto symlinkov), postavi PG,
    # izvede runbook §2+§3 sekvenco in ASERTIRA izhode (fail-closed).
    # OPOMBA: oven/bun slika ima bun postinstall privzeto BLOKIRAN — skripta
    # je zato namenoma neodvisna od postinstall hidracije (pg-symlinks.json).
    - mkdir -p reports
    - PG_LIVE_REPORT=reports/pg-live-report.json bun scripts/pg-live-verify.ts
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

build:
  stage: build
  script:
    - bun install --frozen-lockfile
    - bunx prisma generate
    - bun run build

smoke:
  stage: smoke
  variables:
    DATABASE_URL: "file:/tmp/ci-smoke.db"
    PORT: "3100"
    # HOSTNAME mora biti EKSPlicitno 0.0.0.0: Docker runnerji nastavijo
    # HOSTNAME na ime vsebnika (npr. runner-xyz-project-87315476-…), Next
    # standalone strežnik pa se veže nanj — localhost potem NI dosegljiv
    # (naučeno iz prvega zagona pipeline 2927141601: strežnik je bil zdrav,
    # a vezan napačno; 0.0.0.0 = vsi vmesniki).
    HOSTNAME: "0.0.0.0"
    # CI-only LUTILO (nikoli produkcijska vrednost): brez skrivnosti bi
    # SessionProvider na straneh dobil 500 na /api/auth/session in pisal
    # CLIENT_FETCH_ERROR v konzolo — z lutilom endpoint pošteno odgovori
    # „ni seje", tako kot v produkciji z OBVEZNO pravo skrivnostjo.
    NEXTAUTH_SECRET: "ci-dummy-secret-samo-za-dim"
    NEXTAUTH_URL: "http://localhost:3100"
  script:
    - bun install --frozen-lockfile
    - bunx prisma generate
    # MIGRATION SAFETY (§24): sveža SQLite iz praznega stanja. db:materialize
    # NE sprejema --accept-data-loss — destruktivna sprememba pade vrata.
    - rm -f /tmp/ci-smoke.db /tmp/ci-smoke.db-journal
    - bun run db:materialize
    - bun run build
    # Produkcijski standalone strežnik (isti vstop kot `bun run start`,
    # brez tee — dnevnik gre v artefakt reports/server.log).
    - mkdir -p reports
    - (bun .next/standalone/server.js > reports/server.log 2>&1 & echo $! > server.pid)
    - SMOKE_BASE_URL="http://localhost:${PORT}" bun scripts/ci-wait-ready.ts || (echo '--- reports/server.log ---'; cat reports/server.log; exit 1)
    - |
      set -o pipefail
      SMOKE_BASE_URL="http://localhost:${PORT}" SMOKE_REPORT=reports/smoke-report.json bun run smoke | tee reports/smoke.txt
  after_script:
    - kill $(cat server.pid) 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

e2e:
  stage: e2e
  variables:
    DATABASE_URL: "file:/tmp/e2e.db"
    PORT: "3100"
    HOSTNAME: "0.0.0.0"
    NEXTAUTH_SECRET: "ci-dummy-secret-samo-za-dim"
    NEXTAUTH_URL: "http://localhost:3100"
  script:
    - bun install --frozen-lockfile
    - bunx prisma generate
    # ZASNOVA 2.65.3 (lekcija iz lokalne CI-paritetne verifikacije 15. 10.,
    # ujeta PRED zagonom na runnerjih — lekcija 1 uporabljena tudi na CI):
    # (a) dev-mode webServer (`bunx next dev`) je turbopack PANIC-al in dev
    # prekrivanja so falila mobilne overflow teste; (b) brez seeda zlata pot
    # ni imela Bleda (sveža baza = 0 destinacij). E2E zato teče nad
    # PRODUKCIJSKIM standalone buildom (isti vzorec kot smoke) + SEEJANA
    # baza — testiramo to, kar pošiljamo (16/16 lokalno potrjeno).
    - rm -f /tmp/e2e.db /tmp/e2e.db-journal
    - bunx prisma db push --skip-generate
    - bun prisma/seed.ts
    - bun run build
    - mkdir -p reports
    - (bun .next/standalone/server.js > reports/e2e-server.log 2>&1 & echo $! > server.pid)
    - SMOKE_BASE_URL="http://localhost:${PORT}" bun scripts/ci-wait-ready.ts
    - bunx playwright install --with-deps chromium
    - E2E_BASE_URL="http://localhost:${PORT}" bun run e2e
  after_script:
    - kill $(cat server.pid) 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - reports/
    expire_in: 1 week
